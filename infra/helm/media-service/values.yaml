replicaCount: 2
image:
  repository: ghcr.io/urbanreport/media-service
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3002
env:
  NODE_ENV: production
  PORT: "3002"
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
livenessProbe:
  httpGet:
    path: /health
    port: 3002
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 3002
  initialDelaySeconds: 10
  periodSeconds: 5
