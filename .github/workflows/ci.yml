name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
      NX_HEAD: ${{ github.event_name == 'pull_request' && github.sha || 'HEAD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint affected projects
        run: npx nx affected:lint --base="${NX_BASE}" --head="${NX_HEAD}"

      - name: Typecheck affected projects
        run: npx nx affected:typecheck --base="${NX_BASE}" --head="${NX_HEAD}"

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      NX_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
      NX_HEAD: ${{ github.event_name == 'pull_request' && github.sha || 'HEAD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run affected unit tests
        run: npx nx affected:test --base="${NX_BASE}" --head="${NX_HEAD}" --ci --coverage

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      NX_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
      NX_HEAD: ${{ github.event_name == 'pull_request' && github.sha || 'HEAD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build affected projects
        run: npx nx affected:build --base="${NX_BASE}" --head="${NX_HEAD}"
