services:
  postgresql:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: urbanreport
      POSTGRES_USER: urbanreport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanreport -d urbanreport"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - urbanreport-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - urbanreport-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - urbanreport-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - urbanreport-network

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic report.created --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic report.status_changed --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic report.confirmed --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic media.uploaded --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic media.processed --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic media.uploaded.dlq --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic municipality.assigned --partitions 3 --replication-factor 1
    networks:
      - urbanreport-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command:
      - start-dev
      - --import-realm
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - urbanreport-network

  report-service:
    build:
      context: ./apps/report-service
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./apps/report-service/.env
    ports:
      - "3001:3001"
    networks:
      - urbanreport-network

  media-service:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ./apps/media-service/.env
    ports:
      - "3002:3002"
    networks:
      - urbanreport-network

  media-worker:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    command: node dist/worker.js
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ./apps/media-service/.env
    networks:
      - urbanreport-network

networks:
  urbanreport-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
